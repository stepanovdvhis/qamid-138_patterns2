name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start SUT (Application)
        run: |
          java -jar artifacts/app-ibank.jar -P:profile=test &
          sleep 15

      - name: Run Tests
        run: ./gradlew test -Dselenide.headless=true -Dselenide.browser=chrome